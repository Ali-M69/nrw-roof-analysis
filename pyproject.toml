[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrw-roofs"
version = "0.1.0"
description = "Building and roof analysis from open NRW LiDAR and orthophotos (PDAL + GDAL)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ali Mirzazade" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",      # GDAL bindings: GeoTIFF/COG, JP2 orthophotos, polygonize, reprojection
    "shapely>=2.0",
    "laspy[lazrs]>=2.4",  # fallback LAZ reader when PDAL is not installed
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]
# PDAL is installed from conda-forge (see environment.yml); the Python bindings are "pdal".

[project.scripts]
nrw-roofs = "nrw_roofs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
